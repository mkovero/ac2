name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # The release workflow runs the same gates on every OS before it packages anything.
  workflow_call:
    inputs:
      all_os:
        type: boolean
        default: false
  # `gh workflow run ci.yml --ref <branch> -f all_os=true` runs the macOS/Windows jobs on demand;
  # `-f full=true` runs the full test tier on Linux only. A push runs the quick tier.
  # `-f soak_minutes=60` adds the Windows job (if all_os did not) and runs its FlexASIO
  # session that long, sampled once a minute (tools/release/windows-asio.ps1).
  workflow_dispatch:
    inputs:
      all_os:
        type: boolean
        default: false
      full:
        type: boolean
        default: false
      soak_minutes:
        description: Minutes of the Windows FlexASIO session soak (0 = the 30 s run); the job's 6 h limit includes the build
        type: number
        default: 0

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A newer push supersedes a branch/PR run. Every main commit runs to the end, so main keeps
  # saving the caches every other ref restores from.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Line tables keep file:line in panics and backtraces. Full debuginfo (the dev default) roughly
  # doubles the target dir and its link time (PDBs on Windows) and the cache that carries it.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_NET_RETRY: "10"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # With no arguments rustup installs the toolchain + components pinned in rust-toolchain.toml.
      - name: Install pinned toolchain
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - name: No Rust file over 1000 lines
        run: tools/release/loc-check.sh

  # clippy is a check build and shares no artifacts with the test build, so on the slow runners
  # it runs in its own job beside the tests instead of before them. macOS runs it inline (see
  # `test`): it is not the critical path there and macOS minutes are the expensive ones.
  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pushes check Linux only: deploys are built on the rigs, not from CI artifacts, and
        # macOS/Windows run when asked (dispatch with all_os) and before every release.
        os: ${{ fromJSON(inputs.all_os && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake libjack-jackd2-dev

      - name: Windows linker
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=rust-lld" >> "$GITHUB_ENV"

      # Pinned, immutable libsodium archive instead of the build script's rolling download
      # (see tools/release/fetch-libsodium.sh).
      - name: Vendored libsodium
        if: runner.os == 'Windows'
        shell: bash
        run: echo "SODIUM_DIST_DIR=$(tools/release/fetch-libsodium.sh "$RUNNER_TEMP/libsodium-dist")" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Disk headroom
        if: always()
        shell: bash
        run: df -h . && du -sh target 2>/dev/null || true

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.all_os && '["ubuntu-latest","macos-latest","windows-latest"]' || inputs.soak_minutes > 0 && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake libjack-jackd2-dev \
            mesa-vulkan-drivers libvulkan1
          # Hosted Linux runners have no GPU; lavapipe (Vulkan) is the only adapter wgpu can use.
          {
            echo "WGPU_BACKEND=vulkan"
            echo "AC2_GPU_FALLBACK=1"
            echo "AC2_REQUIRE_GPU=1"
          } >> "$GITHUB_ENV"

      - name: macOS system deps
        if: runner.os == 'macOS'
        run: |
          command -v cmake || brew install cmake
          # Runners expose a paravirtual Metal device; there is no software Metal adapter.
          { echo "WGPU_BACKEND=metal"; echo "AC2_REQUIRE_GPU=1"; } >> "$GITHUB_ENV"

      - name: Windows GPU env + linker
        if: runner.os == 'Windows'
        shell: bash
        # WARP (software D3D12) ships with Windows. rust-lld (lld-link) links the many test
        # binaries far faster than MSVC link.exe.
        run: |
          {
            echo "WGPU_BACKEND=dx12"
            echo "AC2_GPU_FALLBACK=1"
            echo "AC2_REQUIRE_GPU=1"
            echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=rust-lld"
          } >> "$GITHUB_ENV"

      # Pinned, immutable libsodium archive instead of the build script's rolling download
      # (see tools/release/fetch-libsodium.sh).
      - name: Vendored libsodium
        if: runner.os == 'Windows'
        shell: bash
        run: echo "SODIUM_DIST_DIR=$(tools/release/fetch-libsodium.sh "$RUNNER_TEMP/libsodium-dist")" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          # A failing test should not throw away the dependency build.
          cache-on-failure: true
          # Only main writes caches (branches and PRs restore main's). Keeps the 10 GB repo
          # budget for main's keys and skips the multi-minute save on Windows branch runs.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: clippy
        if: runner.os == 'macOS'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Pinned like the toolchain: the test runner decides what a pass is.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.144

      - name: build tests
        run: cargo nextest run --workspace --locked --no-run

      - name: No VC++ runtime imports
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/release/check-windows-deps.ps1 target/debug/ac2.exe target/debug/ac2d.exe target/debug/ac2-ui.exe

      - name: test
        # mDNS discovery tests run on loopback with a private port; the runners have
        # multicast on loopback, so a missing answer is a failure here, not a skip.
        env:
          AC2_REQUIRE_MDNS: "1"
        # Quick tier (no `slow_*`) on a push; everything on an all-OS or release run or on request.
        run: cargo nextest run --workspace --locked --profile ${{ (inputs.all_os || inputs.full) && 'ci-full' || 'ci' }}

      # nextest does not run doctests.
      - name: doctests
        run: cargo test --workspace --locked --doc

      # A hosted runner has no ASIO driver: before FlexASIO is installed, the backend must
      # say so by name and point at FlexASIO.
      - name: No ASIO driver message
        if: runner.os == 'Windows' && !cancelled()
        shell: pwsh
        run: |
          $out = & target/debug/ac2.exe selftest duplex --backend asio 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -eq 0) { throw 'selftest passed with no ASIO driver installed' }
          if ($out -notmatch 'No ASIO driver found' -or $out -notmatch 'github.com/dechamps/FlexASIO') {
            throw 'no named "No ASIO driver found" message pointing at FlexASIO'
          }
          # The expected failure's exit code is not this step's.
          exit 0

      # ASIO through FlexASIO on a virtual cable, with the debug binaries built above: hosted
      # Windows runners have no audio interface. VB-CABLE gives a render endpoint looped into a
      # capture one; it is installed after the tests so they see the runner as it is. Outputs
      # stay silent. These run after a failed test too: the binaries exist once the tests
      # built them.
      - name: Virtual audio cable (VB-CABLE)
        if: runner.os == 'Windows' && !cancelled()
        uses: LABSN/sound-ci-helpers@e9d6ba52163a3283714a68412036ddf33f78d49c # main, 2026-06

      - name: Windows Audio service
        if: runner.os == 'Windows' && !cancelled()
        shell: pwsh
        run: |
          foreach ($s in 'AudioEndpointBuilder', 'Audiosrv') {
            Set-Service -Name $s -StartupType Automatic
            Start-Service -Name $s
          }
          Get-Service AudioEndpointBuilder, Audiosrv | Format-Table -AutoSize
          Get-CimInstance Win32_SoundDevice | Format-Table -AutoSize Name, Status
          # The runner image denies microphone access to desktop apps. FlexASIO opens the
          # cable through WASAPI, which then refuses every capture client with E_ACCESSDENIED.
          $cs = 'SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone'
          foreach ($k in "HKLM:\$cs", "HKCU:\$cs", "HKCU:\$cs\NonPackaged") {
            New-Item -Path $k -Force | Out-Null
            Set-ItemProperty -Path $k -Name Value -Value Allow
          }

      # FlexASIO (MIT): an ASIO driver over the Windows audio stack (WASAPI underneath), the
      # ASIO path for devices without a vendor driver, and here the only ASIO driver.
      - name: FlexASIO driver
        if: runner.os == 'Windows' && !cancelled()
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'FlexASIO-1.10b.exe'
          Invoke-WebRequest -Uri https://github.com/dechamps/FlexASIO/releases/download/flexasio-1.10b/FlexASIO-1.10b.exe -OutFile $exe
          $sha = (Get-FileHash -Algorithm SHA256 $exe).Hash
          if ($sha -ne 'FE496BCC08D6C421C6244C8A60AC7B538560BDA138000FD1A54AB8EBCE031209') { throw "FlexASIO installer hash $sha" }
          $p = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "FlexASIO installer exited $($p.ExitCode)" }
          Get-ItemProperty -Path 'HKLM:\SOFTWARE\ASIO\FlexASIO' | Format-List

      - name: ac2 on FlexASIO (ASIO)
        if: runner.os == 'Windows' && !cancelled()
        shell: pwsh
        env:
          SOAK_MINUTES: ${{ inputs.soak_minutes || 0 }}
        run: tools/release/windows-asio.ps1 -Bin target/debug -LogDir virtual-audio-logs -SoakMinutes $env:SOAK_MINUTES

      # The app on the same driver: ac2-ui hosting its daemon on ASIO comes up, receives the
      # device list with FlexASIO in it, and quits on its own (`--smoke`). No session opens,
      # so nothing plays. Runs after the step above, whose daemon has let the driver go.
      - name: ac2-ui on FlexASIO (embedded daemon)
        if: runner.os == 'Windows' && !cancelled()
        shell: pwsh
        run: |
          $log = 'virtual-audio-logs'
          New-Item -ItemType Directory -Force -Path $log | Out-Null
          $p = Start-Process -FilePath target/debug/ac2-ui.exe -PassThru -NoNewWindow `
            -ArgumentList '--embedded', '--backend', 'asio', '--no-discovery', '--smoke' `
            -RedirectStandardOutput "$log/ac2-ui.stdout.txt" -RedirectStandardError "$log/ac2-ui.stderr.txt"
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) {
            Stop-Process -Id $p.Id -Force
            throw 'ac2-ui did not quit within 120 s'
          }
          $out = Get-Content "$log/ac2-ui.stdout.txt" -Raw
          Write-Host $out
          Get-Content "$log/ac2-ui.stderr.txt" -ErrorAction SilentlyContinue | Write-Host
          if ($p.ExitCode -ne 0) { throw "ac2-ui exited $($p.ExitCode)" }
          if ($out -notmatch '(?m)^smoke: ok\r?$') { throw 'ac2-ui did not receive the device list' }
          if ($out -notmatch '(?m)^smoke: device Asio "FlexASIO": [1-9]\d* in, [1-9]\d* out') {
            throw 'FlexASIO with inputs and outputs is missing from the device list'
          }

      # Core Audio on BlackHole, a virtual loopback device (hosted macOS runners
      # have no audio hardware), with the debug binaries built above. The driver loads only
      # after coreaudiod restarts; no reboot is needed. sox is the stimulus the script plays
      # into BlackHole (ac2's outputs stay silent). See docs/design/macos-ci-audio.md.
      - name: Virtual audio device (BlackHole)
        if: runner.os == 'macOS' && !cancelled()
        run: |
          brew install --cask blackhole-2ch
          brew install sox
          sudo launchctl kickstart -kp system/com.apple.audio.coreaudiod || sudo killall coreaudiod

      # The exact-index check of the coreaudio backend: a standalone crate (it plays
      # impulses into BlackHole, so it is never a workspace member and never ships).
      - name: Build coreaudio-loop
        if: runner.os == 'macOS' && !cancelled()
        timeout-minutes: 15
        run: cargo build --manifest-path tools/release/coreaudio-loop/Cargo.toml --target-dir target

      # ac2d's default backend (coreaudio); then coreaudio-loop's impulses and, last, a
      # revoked microphone grant.
      - name: ac2 on BlackHole (Core Audio)
        if: runner.os == 'macOS' && !cancelled()
        timeout-minutes: 20
        run: tools/release/macos-blackhole.sh target/debug virtual-audio-logs target/debug/coreaudio-loop

      - name: Upload virtual-audio logs
        if: runner.os != 'Linux' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: virtual-audio-logs-${{ runner.os }}
          path: virtual-audio-logs/
          if-no-files-found: ignore

      - name: Disk headroom
        if: always()
        shell: bash
        run: df -h . && du -sh target 2>/dev/null || true

      - name: Upload golden-image diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-images-${{ matrix.os }}
          # ac2-testkit's comparisons, and egui_kittest's UI snapshots beside their goldens.
          path: |
            target/golden-images/
            crates/*/tests/snapshots/*.new.png
            crates/*/tests/snapshots/*.diff.png
          if-no-files-found: ignore

  # ac2's measurements against the committed host baselines (tools/crosscheck, README "CI and
  # releases"): the digital DUT matrix on a JACK dummy server, whose playback ports lead
  # nowhere, with ac2d bounded at -10 dBFS. It runs beside `test` and is sized to end before
  # it: a push measures a reduced matrix, `-f full=true` and all-OS/release runs every case.
  # A worse status, a judged value beyond its step or a lost baseline check fails it; the
  # ac2 build hash is provenance, never compared.
  crosscheck:
    name: crosscheck (host DUT)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Linux system deps
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config cmake libjack-jackd2-dev jackd2

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python deps
        run: pip install numpy JACK-Client pytest Pillow

      - name: build ac2, ac2d, ac2-jack-dut
        run: cargo build --locked -p ac2d -p ac2-cli -p ac2-jack-dut

      - name: crosscheck pytest
        working-directory: tools/crosscheck
        run: python -m pytest -q

      # One case at one level takes about 2.3 min, so a push measures the case with the most
      # judged rows (harmonics well above the DUT's noise, the 20 Hz high-pass ahead of the
      # polynomial) at -10 dBFS; full and all-OS/release runs measure every case at both
      # baseline levels (about 20 min).
      - name: DUT matrix against baselines/host
        env:
          FULL: ${{ inputs.all_os || inputs.full }}
        run: |
          if [ "$FULL" != true ]; then set -- --cases loud-hp --levels -10; fi
          tools/crosscheck/ci-host.sh target/debug crosscheck-out "$@"

      - name: Upload crosscheck reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crosscheck-host
          path: |
            crosscheck-out/runs/*/report/
            crosscheck-out/*.log
            crosscheck-out/home/.local/state/ac2/
          if-no-files-found: ignore

  refgen:
    name: refgen check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install refgen requirements
        if: hashFiles('tools/refgen/requirements.txt') != ''
        run: pip install -r tools/refgen/requirements.txt
      - name: Check golden vectors are up to date
        if: hashFiles('tools/refgen/generate.py') != ''
        run: python tools/refgen/generate.py --check

  protocol:
    name: protocol fixtures (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r tools/protocol/requirements.txt
      - name: Python decodes Rust fixtures and matches expectations
        run: python tools/protocol/fixtures.py check
