[package]
name = "ac2-plotcheck"
description = "Renders a frequency-response file through ac2-scene and ac2-plot to a PNG, with the plot geometry beside it, for the cross-check suite's graph comparison against REW."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "plotcheck"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
ac2-plot = { path = "../../crates/ac2-plot" }
ac2-proto = { path = "../../crates/ac2-proto" }
ac2-scene = { path = "../../crates/ac2-scene" }
ac2-testkit = { path = "../../crates/ac2-testkit", features = ["image"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
