[package]
name = "ac2-jack-dut"
description = "Software device under test for the cross-check suite: a JACK client with exactly known filters and harmonic distortion."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }

# Linux only, as in ac2-audio: the crate loads libjack at run time, so builds never need it
# and a missing library or server is a run-time error, not a link error.
[target.'cfg(target_os = "linux")'.dependencies]
jack = "0.13"
ctrlc = { version = "3", features = ["termination"] }
