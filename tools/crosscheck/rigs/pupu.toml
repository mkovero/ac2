# pupu: RME FF400, JACK 96 kHz / 256. Wiring and ceilings: docs/rigs/pupu.md.
# The suite runs ON this host (JACK clients must be local; REW's API and its file imports
# are local); rig-run.sh on the dev host copies the package here, runs it, fetches the run.

[rig]
name = "pupu"
ssh = "mui@192.168.9.27"
workdir = "~/crosscheck"                         # package + runs on the rig
python = "~/ac2-test/venv-meas/bin/python"       # numpy + JACK-Client; scipy/matplotlib not needed here
sample_rate = 96000
system_max_dbfs = -50.0      # ac2d --max-level on this rig; speaker ceiling too
electrical_max_dbfs = -10.0  # the most --allow-electrical-level may lift electrical-only outputs to
speaker_max_dbfs = -50.0     # clamped to -50 in code whatever is written here
mains_hz = 50.0

# Outputs by 1-based channel. role: speaker | electrical | loopback. Anything not listed is refused.
[outputs.1]
port = "system:playback_1"
role = "speaker"
note = "Genelec 1083"
[outputs.2]
port = "system:playback_2"
role = "loopback"
note = "cable to in 2 (reference)"
[outputs.5]
port = "system:playback_5"
role = "electrical"
note = "Xone:62 ch 1 line L to master L, in 5 (balanced)"
[outputs.6]
port = "system:playback_6"
role = "electrical"
note = "Xone:62 ch 1 line R to master R, in 6"

[inputs.1]
port = "system:capture_1"
note = "MM1 34804 at 90 degrees"
[inputs.2]
port = "system:capture_2"
note = "loopback reference"
[inputs.5]
port = "system:capture_5"
note = "Xone master L"
[inputs.6]
port = "system:capture_6"
note = "Xone master R"

# The two paths the suite measures. forbidden_outputs: refused in that path's stages.
[paths.xone]
kind = "electrical"
out = 5
ref_out = 2
meas_in = 5
ref_in = 2
forbidden_outputs = [1]

[paths.genelec]
kind = "speaker"
out = 1
ref_out = 2
meas_in = 1
ref_in = 2
speaker_min_request_hz = 20.0   # never ask a sweep on the speaker to start lower
speaker_min_emit_hz = 5.0       # refuse if ac2 says it will emit below this (its LF extension rises from there)

[paths.dut]
# The digital DUT (README, "Digital DUT path"): a software device with exact harmonics.
# out/ref_out/meas_in/ref_in are ac2's channel numbers for its stages; ac2d also connects
# its out 5 and out 2 to the hardware (approved electrical/loopback), so the level policy
# checks those exactly as on the Xone path. `ports`: what the suite's own player and recorder
# use for this path, and what ac2 is patched onto for the ac2 stages.
kind = "digital"
out = 5
ref_out = 2
meas_in = 3
ref_in = 2
ports = { out = "ac2-dut:dut_in", ref_out = "ac2-dut:ref_in", meas_in = "ac2-dut:dut_out", ref_in = "ac2-dut:ref_out" }
forbidden_outputs = [1]
mains_hz = 0.0                  # no mains in software: the mains exclusions skip this path

[dut]
binary = "~/ac2-test/bin/ac2-jack-dut"   # copied there by hand (README)
client = "ac2-dut"
ac2_client = "ac2"                       # ac2d's JACK client: ports ac2:in_N, ac2:out_N (1-based)
# poly(u) = Σ c_k u^k. At the suite's -10 dBFS (A = 0.316), 1 kHz: H2 -50.0, H3 -55.1,
# H4 -63.0, H5 -70.1 dBr; 15 Hz: -61.9, -71.2, -76.3, -87.9 (crosscheck/dut.py; peak
# output 0.32). All coefficients positive: no harmonic cancels anywhere as the pre-filter
# lowers the amplitude at LF (a cancelling set would put deep, level-sensitive nulls there).
poly = [0.0, 1.0, 0.002, 0.008, 0.18, 0.5]
pre = [{ type = "hp1", hz = 20.0 }]      # a Wiener part: sweeps see it only approximately at LF
post = [{ type = "lp2", hz = 30000.0, q = 0.7071 }]
noise_dbfs = -120.0

[ac2]
# The CLI must reach the rig's daemon from here. Either pair the rig's own CLI once
# (README, "One-time setup") and use localhost, or run it on another paired host over ssh:
#   cmd = ["ssh", "mui@192.168.9.25", "~/ac2-test/bin/ac2", "--remote", "192.168.9.27"]
cmd = ["~/ac2-test/bin/ac2", "--remote", "localhost"]
timeout = "5s"
recordings_dir = "~/.local/share/ac2/recordings"  # ac2d --recordings default; `rec` files land here
cal_store = "~/.config/ac2/calibrations.json"
session_open = ["session", "open", "--backend", "jack", "--in", "1-8", "--outputs", "6",
                "--loopback-out", "2", "--loopback-in", "2", "--mic", "1=MM1 34804"]
systemd_unit = "ac2d.service"
# The electrical drop-in (only with --allow-electrical-level): a runtime unit override,
# gone at reboot, removed by the suite in its finally.
dropin = "/run/user/{uid}/systemd/user/ac2d.service.d/90-crosscheck-electrical.conf"
exec_start = "%h/ac2-test/bin/ac2d --listen tcp://0.0.0.0 --name pupu --max-level {level}"
mic_input = 1

[rew]
api = "http://localhost:4735"
stimulus = "/home/mui/rew-dl/sweep96k.wav"   # REW-generated 10 Hz - 40 kHz, 512k, peak -50 dBFS, 96 kHz float
stimulus_speaker = "/home/mui/rew-dl/sweep96k-20-20k.wav"  # 20 Hz - 20 kHz for the speaker (README); 10 Hz is refused
stimulus_channel = 1
keep_measurements = false                    # delete the suite's imports from REW afterwards

[pipewire]
# Only the ambient stage uses it (REW's SPL meter and RTA read live input through the
# jack-tunnel client pw_rew). Started if not running, stopped afterwards if the suite started it.
start = [["systemctl", "--user", "start", "pipewire.socket", "pipewire.service", "wireplumber.service"]]
stop = [["systemctl", "--user", "stop", "wireplumber.service", "pipewire.service", "pipewire.socket"]]
is_active = ["systemctl", "--user", "is-active", "pipewire.service"]
client = "pw_rew"
# REW's wiring while its sweep path is in use (restored after the ambient stage)
normal_capture = { capture_FL = "system:capture_5", capture_FR = "system:capture_2" }
ambient_capture = { capture_FL = "system:capture_1" }

[stages.ambient]
seconds = 60

[stages.sine]
# Steady sines on each path. Frequencies are nudged so H2..H5 stay off 50 Hz multiples.
# Xone: mains lines stand at every 50 Hz multiple to 2 kHz, and a sweep reads a harmonic over
# ±17 Hz below ~1 kHz, so below 300 Hz no tone keeps more than three of H2..H5 clear. Each tone
# keeps at least two (tests/test_rig_tones.py); together they cover every harmonic below
# 100 Hz, and 1040 Hz clears the mains columns of the displayed group delay.
xone_hz = [15, 26.25, 35, 40.5, 56.2, 60.5, 93.9, 1040, 10000]
# DUT: H5 of every tone below 40 kHz (and fs/2); the LF ones sit where the 20 Hz pre-filter
# lowers the polynomial's input amplitude.
dut_hz = [12, 15, 26.25, 40.5, 93.9, 1040, 5000, 7000]
genelec_hz = [50, 100, 200, 500, 1000, 2000, 5000, 10000]
gd_pairs = true            # phase at f·2^(±1/48) for group delay (xone only)
probe_seconds = 2.0
min_periods = 40           # an LF tone gets at least this many periods
max_seconds = 20.0
noise_seconds = 10.0
target_floor_dbr = { xone = -95.0, genelec = -80.0, dut = -100.0 }
budget_seconds = { xone = 180.0, genelec = 180.0, dut = 120.0 }
fade_seconds = 0.1
settle_seconds = 0.5

[stages.ac2_sweep]
# Variants on the Xone path. plan = true: repeats/duration chosen from a probe to reach the
# target floor within the budget; false: run exactly as written (comparable across runs).
xone = [
  { name = "10Hz-5.5s", from = "10hz", to = "40khz", duration = 5.5, repeats = 1, plan = false },
  { name = "3Hz-5.5s", from = "3hz", to = "40khz", duration = 5.5, repeats = 1, plan = false },
  { name = "10Hz-11s", from = "10hz", to = "40khz", duration = 11.0, repeats = 1, plan = false },
  { name = "dist", from = "20hz", to = "40khz", duration = 5.5, repeats = 1, plan = true },
]
dut = [
  { name = "10Hz-5.5s", from = "10hz", to = "40khz", duration = 5.5, repeats = 1, plan = false },
  { name = "3Hz-5.5s", from = "3hz", to = "40khz", duration = 5.5, repeats = 1, plan = false },
  { name = "10Hz-11s", from = "10hz", to = "40khz", duration = 11.0, repeats = 1, plan = false },
  { name = "dist", from = "20hz", to = "40khz", duration = 5.5, repeats = 1, plan = true },
]
genelec = [
  { name = "20Hz-5.5s", from = "20hz", to = "20khz", duration = 5.5, repeats = 1, plan = false },
  { name = "dist", from = "20hz", to = "20khz", duration = 5.5, repeats = 1, plan = true },
]
target_floor_dbr = { xone = -95.0, genelec = -80.0, dut = -100.0 }
floor_band_hz = { xone = [100, 10000], genelec = [100, 10000], dut = [100, 10000] }
budget_seconds = { xone = 180.0, genelec = 180.0, dut = 180.0 }
max_repeats = 8
max_duration = 30.0
noise_lead_seconds = 1.0   # raw capture starts this long + one sweep before the sweep (noise windows)

[stages.ac2_tf]
settle_seconds = 20.0
blocks = 8
max_level_dbfs = -20.0  # pink noise's peaks sit well above its level

[stages.rew]
repeats = 1
