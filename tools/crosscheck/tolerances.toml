# Tolerances: |value| <= pass -> PASS, <= warn -> WARN, else FAIL. A comparison resting on an
# upper bound (a reading below floor + margin) is INCONCLUSIVE, never PASS/FAIL.
# Values are the 2026-10-07 pupu agreement with some room (docs/rigs/pupu.md, "REW
# cross-check, electrical"; docs/design/subsample-arrival-group-delay.md).

[distortion]
margin_db = 10.0            # a harmonic counts at floor + margin or above
floor_disagree_db = 6.0     # flag a column where ac2's floor and the raw-recording floor differ more

# magnitude (dB) and phase (deg): max |deviation from the band mean| and |band mean|
[band.mag_lf]               # below 100 Hz
pass = 0.05
warn = 0.2
[band.mag_mf]               # 100 Hz - 1 kHz
pass = 0.03
warn = 0.1
[band.mag_hf]               # 1 - 20 kHz
pass = 0.03
warn = 0.1
[band.phase]
pass = 1.0
warn = 3.0
[band.mag_tf]               # live transfer, coherence-gated
pass = 0.1
warn = 0.3
[band.mag_acoustic]         # speaker path: same recording or close in time, room unchanged
pass = 0.3
warn = 1.0
[band.phase_acoustic]
pass = 3.0
warn = 10.0

[level]
convention_db = { pass = 0.1, warn = 0.5 }   # ac2 / REW / sine on the same digital level
offset_db = { pass = 0.1, warn = 0.3 }       # ac2 meas/ref vs REW (meas - ref) absolute
absolute_spl_db = { pass = 0.5, warn = 1.0 } # acoustic response in dB SPL, sources vs sine
ambient_leq_db = { pass = 0.5, warn = 1.0 }  # Leq over the same window, broadband
ambient_band_db = { pass = 1.0, warn = 2.0 } # per third octave

[delay]
electrical_us = { pass = 0.3, warn = 1.0 }   # arrival vs the direct cross-spectrum
acoustic_us = { pass = 2.0, warn = 10.4 }    # one sample at 96 kHz as the warn limit
ir_peak_cells = { pass = 1.0, warn = 2.0 }   # ac2 IR bucket (0.125 ms) vs REW peak

[etc]
median_db = { pass = 2.0, warn = 5.0 }       # cells within 60 dB of the peak, -5 ... 50 ms (different takes: noise differs)

[gd]
# relative error vs the steady-sine truth, per frequency at >= 16 Hz
fit_rel = { pass = 0.10, warn = 0.25 }       # +-1/12 oct slope fit
central_rel = { pass = 0.15, warn = 0.40 }   # ac2 as displayed (central difference)
high_abs_us = { pass = 0.5, warn = 2.0 }     # above 1 kHz an absolute limit (GD is a few us)

[harmonics]
vs_truth_db = { pass = 3.0, warn = 6.0 }     # value vs steady-sine value
lf_onset_excess_db = { pass = 3.0, warn = 6.0 }
# A path with coupling capacitors (the Xone) shows raised LF H2 for about 0.1-0.2 s after a
# sweep's fade-in ends (steady 22 Hz after a dist-like chirp: +4.5 dB at 50 ms, steady by
# 0.1-0.2 s): a sweep reaching 22 Hz sooner than this after full level measures that, not ac2.
lf_onset_settle_s = 0.3

[dut]
# Harmonics against the digital DUT's analytic truth (crosscheck/dut.py), dB.
# The steady sine is the method check: same DSP chain, a steady state, the exact frequency;
# only its floor (−120 dBFS noise) and the window's lobe sum stand between it and the truth.
sine_db = { pass = 0.1, warn = 0.3 }
# Sweeps (ac2, REW's offline import): a starting point. A sweep reads the pre-filter (the
# Wiener part) only in the instantaneous-frequency approximation, so near its 20 Hz corner a
# deviation can be the model, not the analyser.
sweep_db = { pass = 0.5, warn = 1.0 }
grid_per_octave = 3          # sweep columns compared on this log grid besides the sine tones

[room]
edt_rel = { pass = 0.05, warn = 0.15 }
t20_rel = { pass = 0.05, warn = 0.15 }
t30_rel = { pass = 0.05, warn = 0.15 }
c50_db = { pass = 0.5, warn = 1.5 }
c80_db = { pass = 0.5, warn = 1.5 }
d50 = { pass = 0.02, warn = 0.05 }

[coherence]
min_fraction_099 = 0.95     # live TF: share of columns 31 Hz - 20 kHz at gamma^2 >= 0.99 (info below)

[osm]
# The OSM stage (README, "OSM stage"): ac2 and Open Sound Meter's DSP on the same WAV pairs.
# Synthetic cases have a closed-form truth; recordings are ac2 against OSM only.
mag_truth_db = { pass = 0.05, warn = 0.2 }      # |H| vs the fixture's closed form, max over γ² >= 0.95 columns
phase_truth_deg = { pass = 0.5, warn = 2.0 }    # phase vs closed form, max
mag_osm_db = { pass = 0.05, warn = 0.2 }        # ac2 vs OSM, synthetic, max over columns both at γ² >= 0.95
phase_osm_deg = { pass = 0.5, warn = 2.0 }
mag_osm_rig_db = { pass = 0.3, warn = 1.0 }     # ac2 vs OSM on a rig recording, median |difference| (windows see a room differently)
phase_osm_rig_deg = { pass = 3.0, warn = 10.0 }
mag_h1_noise_db = { pass = 0.1, warn = 0.3 }    # ac2's H1 in uncorrelated noise vs 0 dB, median 1-20 kHz
mag_osm_bias_db = { pass = 0.2, warn = 0.5 }    # OSM's mean |M|/|R| vs its expected bias E|1 + N/R|
coh_ac2 = { pass = 0.02, warn = 0.05 }          # ac2 γ² vs the fixture's true γ², mean 1-20 kHz
coh_osm_model = { pass = 0.02, warn = 0.05 }    # OSM γ² vs E[γ̂²] for its overlapped 21-tick estimate
delay_osm_samples = { pass = 0.5, warn = 1.0 }  # OSM's whole-sample finder vs truth
delay_ac2_samples = { pass = 0.05, warn = 0.5 } # ac2's sub-sample finder vs truth
slope_samples = { pass = 0.02, warn = 0.1 }     # phase-slope delay vs truth
delay_vs_osm_samples = { pass = 0.6, warn = 1.0 }  # OSM rounds to a sample (0.5) + ac2's stated 0.1
spectrum_tone_db = { pass = 0.02, warn = 0.1 }  # bin-centred sine, ac2 peak-convention dBFS
spectrum_noise_db = { pass = 0.1, warn = 0.3 }  # white noise per bin, power mean (OSM: Rayleigh mean converted)

[compare]
# `compare` flags a judged value that moved more than max(step[unit], pass_fraction × pass
# limit) from its baseline. The unit step is about the take-to-take scatter of a quiet band;
# a band held to a wider limit is that much noisier (Xone at -50 vs -30 dBFS: 20-100 Hz
# bands 0.03 dB / 0.4 deg apart), so half its pass limit is the smallest move that is the
# analysis or the build rather than the take.
pass_fraction = 0.5
[compare.step]
dB = 0.02
"°" = 0.1
rel = 0.02                  # group delay vs truth, relative: 2 %
"µs" = 0.2
samples = 0.01              # delay finders and phase slopes: a tenth of ac2's stated 0.1-sample finder
"" = 0.01                   # coherence share, D50
bins = 0                    # mask and population counts: any change is a change
columns = 0
Hz = 0.5                    # where a maximum sits: under one 1/48-octave column at 50 Hz (0.72 Hz)
