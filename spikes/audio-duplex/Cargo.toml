[package]
name = "spike-audio-duplex"
description = "Phase 0 spike: audio-duplex (throwaway; findings in docs/design/spike-audio-duplex.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# JACK backend (Linux). Off by default so mac/win builds never need libjack.
jack = ["dep:jack"]

[dependencies]
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
jack = { version = "0.13", optional = true }

# ac2 does not use ALSA: cpal (and libasound with it) is built for macOS and Windows only.
[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.18"
