[workspace]
resolver = "3"
members = ["crates/*", "tools/jack-dut"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/mkovero/ac2"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2

# DSP tests (MTW, delay finder) run tens of seconds unoptimised; keep the math crate fast
# in dev/test builds. Debug assertions stay on.
[profile.dev.package.ac2-core]
opt-level = 2
