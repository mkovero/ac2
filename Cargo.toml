[workspace]
resolver = "3"
members = ["crates/*", "tools/jack-dut"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/mkovero/ac2"
publish = false

# Dependencies used by more than one member: one version requirement for all. A member
# names its own features (`x = { workspace = true, features = [..] }`).
[workspace.dependencies]
chrono = { version = "0.4", default-features = false }
clap = "4.5"
ctrlc = "3"
getrandom = "0.4"
jack = "0.13"
libc = "0.2"
log = "0.4"
num-complex = "0.4"
proptest = "1.11"
realfft = "3.5"
rmp-serde = "1.3"
serde = "1"
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.39", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = "1.53"
tracing = "0.1"
tracing-subscriber = "0.3"
windows-sys = "0.61"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Release builds (rig deploys, packaging) keep every core busy: no cross-crate LTO, which would
# redo all codegen serially in each final binary link, and the default 16 codegen units.
# The DSP and scene math keep a single codegen unit: their hot loops lose inlining across unit
# boundaries otherwise (1/3- and 1/24-octave RTA, band Leq ~5-17 % slower at 16 units).
# A panic in a release build aborts the process (logged first by the panic hook, see
# docs/design/watchdogs.md): systemd restarts it, where an unwound thread would leave the
# rest running half-dead, a stuck value on screen.
[profile.release]
lto = false
panic = "abort"

[profile.release.package.ac2-core]
codegen-units = 1

[profile.release.package.ac2-scene]
codegen-units = 1

# Debug builds keep line tables for the workspace (panic backtraces with file:line) and no
# debuginfo for dependencies: full DWARF made the test binaries about 1 GB each, and linking
# them dominated an incremental test build. `split-debuginfo` is left at each platform's
# default: `unpacked` is not accepted on Windows MSVC, and profiles cannot be per-target.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# DSP tests (MTW, delay finder) run tens of seconds unoptimised; keep the math crate fast
# in dev/test builds. Debug assertions stay on.
[profile.dev.package.ac2-core]
opt-level = 2
