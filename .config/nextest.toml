# cargo-nextest: every test in its own process, so a test's globals (log subscriber,
# allocator counters, process CPU time) never leak into another, and the slowest tests
# overlap the rest instead of holding up their binary. Doctests are not run by nextest:
# `cargo test --doc --workspace` covers them.
#
# Two tiers. A test whose function name starts with `slow_` takes seconds of real time
# (Leq windows filling, backoffs, expiries, the app driven end to end on the real-time
# simulated rig); the default profile skips them, `--profile full` (and plain `cargo test`)
# runs everything. CI runs the quick tier on every push (`ci`) and everything (`ci-full`) on an
# all-OS or release run, or when dispatched with `full`. Rename a test to `slow_…` when it needs about 5 s or more
# after its waits are as short as what it checks allows.

[profile.default]
default-filter = "not test(/(^|::)slow_/)"
# Many tests wait on real time and sleep rather than compute, so more of them than cores
# run at once: on a 12-core machine 16 threads take the full tier from about 100 s (one per
# core) to under 60 s.
test-threads = 16
fail-fast = false
# A test still running after 30 s is reported; after 6 periods (3 min) it is killed: every
# wait in the suite has a ceiling well below that, so a test that long has hung.
slow-timeout = { period = "30s", terminate-after = 6 }
status-level = "slow"
final-status-level = "slow"
failure-output = "immediate-final"

# The real-time tests start first, so they sleep beside the CPU-bound tests instead of
# ending the run on a tail of one or two of them; the longest (20–35 s) first of all.
[[profile.default.overrides]]
filter = """
    test(/(^|::)slow_(filling_windows|windows_go_over|leq_limits_go_over|a_peak_limit)/)
  | test(/(^|::)slow_(leq_set_watch|a_recorders_wav|bands_set_watch|preview_follows)/)
"""
priority = 100

[[profile.default.overrides]]
filter = "test(/(^|::)slow_/)"
priority = 50

# The app's end-to-end tests play their stimulus under the daemon's real 1.5 s lease: a
# test process starved that long by a loaded machine loses the lease and the tone with it,
# and the flow under test then times out. The daemon must stop the sound on such a stall,
# so the only remedy in the test is a second try; nextest reports every retried pass as
# FLAKY, so a test that needs it often still shows.
[[profile.default.overrides]]
filter = "binary_id(ac2-ui::it) & test(/^embedded::/)"
retries = 1

[profile.full]
default-filter = "all()"

# One thread per core: hosted runners have 3–4 and run the GPU tests on a software
# renderer. They are slower and shared: the same tests may take twice as long.
[profile.ci]
test-threads = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci-full]
default-filter = "all()"
test-threads = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 5 }
