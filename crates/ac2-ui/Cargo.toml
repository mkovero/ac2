[package]
name = "ac2-ui"
description = "ac2 desktop UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ac2-ui"
path = "src/main.rs"

[dependencies]
ac2-client = { path = "../ac2-client" }
ac2-plot = { path = "../ac2-plot" }
ac2-proto = { path = "../ac2-proto" }
ac2-scene = { path = "../ac2-scene" }
clap = { version = "4.5", features = ["derive"] }
directories = "6"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wayland", "wgpu", "x11"] }
egui-wgpu = "0.36.2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time", "macros"] }
toml = "0.8"

[dev-dependencies]
ac2-client = { path = "../ac2-client", features = ["test-support"] }
egui_kittest = { version = "0.36.2", features = ["eframe", "snapshot", "wgpu"] }
