[package]
name = "ac2-ui"
description = "ac2 desktop UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ac2-ui"
path = "src/main.rs"

[features]
default = ["embedded"]
# Host the daemon in-process (`ac2-ui --embedded`). Links `ac2d` and through it the DSP and
# audio crates; the UI code itself never uses them (`tests/no_dsp.rs`).
embedded = ["dep:ac2d"]

[dependencies]
ac2-client = { path = "../ac2-client" }
ac2-discovery = { path = "../ac2-discovery" }
ac2d = { path = "../ac2d", optional = true }
ac2-paths = { path = "../ac2-paths", features = ["log"] }
ac2-plot = { path = "../ac2-plot" }
ac2-proto = { path = "../ac2-proto" }
ac2-scene = { path = "../ac2-scene" }
ac2-zmq = { path = "../ac2-zmq" }
# Local time of day (the SPL log's start): the UTC offset in force at an instant.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wayland", "wgpu", "x11"] }
egui-wgpu = "0.36.2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"
toml = "0.8"

[dev-dependencies]
ac2-client = { path = "../ac2-client", features = ["test-support"] }
# Test oracle only: the rig publishes curves smoothed as the daemon would. The app itself
# never links the DSP (tests/no_dsp.rs checks the normal and build edges); the fake
# daemon's band log rows are ac2-traces'.
ac2-core = { path = "../ac2-core" }
ac2-traces = { path = "../ac2-traces" }
num-complex = "0.4"
egui_kittest = { version = "0.36.2", features = ["eframe", "snapshot", "wgpu"] }
tempfile = "3"
