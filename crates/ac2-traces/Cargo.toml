[package]
name = "ac2-traces"
description = "Stored traces: column data, averaging and math channels, text import/export, session files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ac2-core = { path = "../ac2-core" }
ac2-proto = { path = "../ac2-proto" }
num-complex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# Session manifests must read back the exact f64 they wrote (delays, frequencies).
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
