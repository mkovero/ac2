[package]
name = "ac2-audio"
description = "Audio backend trait with explicit capabilities, sample-indexed multichannel blocks; JACK (Linux), cpal (macOS, Windows) and fake backends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# Linux: JACK is the only real backend (JACK2, or PipeWire through pipewire-jack). The crate
# loads libjack at run time, so builds never need it and a missing library or server is
# reported as `AudioError::Unavailable`, not as a link error. No ALSA: nothing links libasound.
[target.'cfg(target_os = "linux")'.dependencies]
jack = "0.13"
log = "0.4"

# macOS and Windows: the OS audio host (Core Audio, WASAPI) through cpal.
[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.18"

# macOS: kqueue timers that opt out of coalescing (see src/timer.rs).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# Linux: tests/jack_cancel.rs cancels a thread inside the libjack log callback.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"
log = "0.4"
