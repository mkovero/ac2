[package]
name = "ac2-audio"
description = "Audio backend trait with explicit capabilities, sample-indexed multichannel blocks; JACK (Linux), Core Audio (macOS), ASIO (Windows) and fake backends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# Linux: JACK is the only real backend (JACK2, or PipeWire through pipewire-jack). The crate
# loads libjack at run time, so a missing library or server is reported as
# `AudioError::Unavailable`, not as a link error. jack-sys's build script still asks pkg-config
# for jack, so building needs JACK's development package. No ALSA: nothing links libasound.
[target.'cfg(target_os = "linux")'.dependencies]
jack = "0.13"
log = "0.4"

# Windows: ASIO is the only backend. ASIO drivers over COM directly, without the Steinberg
# SDK, through ac2's fork of azo 0.5.1 (MIT), pinned: a named apartment thread, a callback-side
# handle for getSamplePosition/outputReady, drivers created with their CLSID as the IID and held
# in Rc across re-entrant calls, names that fill their buffer taken whole (with room for a driver
# that overruns it), and clock sources in one call with names cut at NUL.
[target.'cfg(windows)'.dependencies]
azo = { git = "https://github.com/mkovero/azo", rev = "d6192431409e5c1c702111e12c860261421d1760" }
# Millisecond timer resolution and MMCSS registration (src/timer.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Media", "Win32_System_Threading"] }

# macOS: Core Audio through the HAL (cahal, src/coreaudio_host), and kqueue timers that opt out of coalescing (see src/timer.rs).
[target.'cfg(target_os = "macos")'.dependencies]
cahal = "0.1.0"
libc = "0.2"

# The Core Audio adapter's tests run on every OS against scripted devices, on cahal's pure
# part (types, indexer, channel tables).
[dev-dependencies]
cahal = { version = "0.1.0", default-features = false }

# Linux: tests/jack_cancel.rs cancels a thread inside the libjack log callback.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"
log = "0.4"
