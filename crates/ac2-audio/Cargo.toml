[package]
name = "ac2-audio"
description = "Audio backend trait with explicit capabilities, sample-indexed multichannel blocks; JACK (Linux), cpal (macOS), ASIO (Windows) and fake backends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# Linux: JACK is the only real backend (JACK2, or PipeWire through pipewire-jack). The crate
# loads libjack at run time, so builds never need it and a missing library or server is
# reported as `AudioError::Unavailable`, not as a link error. No ALSA: nothing links libasound.
[target.'cfg(target_os = "linux")'.dependencies]
jack = "0.13"
log = "0.4"

# Windows: ASIO is the only backend. ASIO drivers over COM directly, without the Steinberg
# SDK, through ac2's fork of azo (MIT), pinned: a named apartment thread, a callback-side handle for
# getSamplePosition/outputReady, and names that fill their buffer taken whole.
[target.'cfg(windows)'.dependencies]
azo = { git = "https://github.com/mkovero/azo", rev = "d9964074a230ec96dce55661fbccc1ff3b2ca0a1" }

# macOS: Core Audio through cpal, and kqueue timers that opt out of coalescing (see
# src/timer.rs).
[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18"
libc = "0.2"

# Linux: tests/jack_cancel.rs cancels a thread inside the libjack log callback.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"
log = "0.4"
