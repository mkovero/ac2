[package]
name = "ac2-audio"
description = "Audio backend trait with explicit capabilities, sample-indexed multichannel blocks; JACK, cpal and fake backends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["jack"]
# JACK backend through the `jack` crate (Linux only; a no-op elsewhere). On by default: the
# crate loads libjack at run time, so builds never need libjack and a missing library or server
# is reported as `AudioError::Unavailable`, not as a link error.
jack = ["dep:jack"]

[dependencies]
cpal = "0.18"
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
jack = { version = "0.13", optional = true }
