[package]
name = "ac2d"
description = "ac2 daemon: owns the audio session, measurement jobs and state; serves clients over ZeroMQ."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ac2d"
path = "src/main.rs"

[features]
default = []
# JACK backend (Linux; libjack is loaded at run time).
jack = ["ac2-audio/jack"]

[dependencies]
ac2-audio = { path = "../ac2-audio" }
ac2-core = { path = "../ac2-core" }
ac2-discovery = { path = "../ac2-discovery" }
ac2-paths = { path = "../ac2-paths" }
ac2-proto = { path = "../ac2-proto" }
ac2-traces = { path = "../ac2-traces" }
ac2-zmq = { path = "../ac2-zmq" }
ctrlc = { version = "3", features = ["termination"] }
getrandom = "0.3"
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
ac2-client = { path = "../ac2-client" }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time"] }
rmp-serde = "1.3"
tempfile = "3"
