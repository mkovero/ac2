[package]
name = "ac2d"
description = "ac2 daemon: owns the audio session, measurement jobs and state; serves clients over ZeroMQ."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ac2d"
path = "src/main.rs"

[dependencies]
ac2-archive = { path = "../ac2-archive" }
ac2-audio = { path = "../ac2-audio" }
ac2-core = { path = "../ac2-core" }
ac2-discovery = { path = "../ac2-discovery" }
ac2-paths = { path = "../ac2-paths", features = ["log"] }
ac2-proto = { path = "../ac2-proto" }
ac2-traces = { path = "../ac2-traces" }
ac2-zmq = { path = "../ac2-zmq" }
chrono = { workspace = true, features = ["clock"] }
clap = { workspace = true, features = ["derive"] }
ctrlc = { workspace = true, features = ["termination"] }
getrandom = { workspace = true }
# OSC cues: encoding only; the socket is ours (non-blocking, never on the audio thread).
rosc = "0.11"
num-complex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
# Whole-host CPU use for the health meter (only its CPU figures are read).
sysinfo = { workspace = true, features = ["system"] }
tracing = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
ac2-client = { path = "../ac2-client" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
rmp-serde = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
jack = { workspace = true }
