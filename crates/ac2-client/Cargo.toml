[package]
name = "ac2-client"
description = "Async client for the ac2 daemon: connect, call, subscribe, mirrored state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# An in-process fake daemon (ROUTER + XPUB built from ac2-proto + ac2-zmq) for tests of this
# crate and of ac2-cli. Never used by a shipping binary.
test-support = ["dep:ac2-traces", "dep:ac2-core"]

[dependencies]
ac2-core = { path = "../ac2-core", optional = true }
ac2-paths = { path = "../ac2-paths" }
ac2-proto = { path = "../ac2-proto" }
ac2-traces = { path = "../ac2-traces", optional = true }
ac2-zmq = { path = "../ac2-zmq" }
tokio = { version = "1.53", features = ["rt", "sync", "time", "macros"] }
thiserror = "2"
getrandom = "0.3"

[dev-dependencies]
ac2-client = { path = ".", features = ["test-support"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "sync"] }
tempfile = "3"
