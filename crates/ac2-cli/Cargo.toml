[package]
name = "ac2-cli"
description = "ac2 command-line client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[lib]
name = "ac2_cli"
path = "src/lib.rs"

[[bin]]
name = "ac2"
path = "src/main.rs"

[dependencies]
ac2-client = { path = "../ac2-client" }
ac2-proto = { path = "../ac2-proto" }
ac2-scene = { path = "../ac2-scene" }
ac2-zmq = { path = "../ac2-zmq" }
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.1"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }

[dev-dependencies]
ac2-client = { path = "../ac2-client", features = ["test-support"] }
proptest = "1.11"
tempfile = "3"
