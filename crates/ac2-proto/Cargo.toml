[package]
name = "ac2-proto"
description = "Typed ZeroMQ protocol: commands, events, frame headers, topics and protocol version."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# One sample value per command, reply and frame variant, for fixtures, round-trip and fuzz
# tests here and for tests in the crates that speak the protocol. Never used by a shipping
# binary.
samples = []

[dependencies]
serde = { workspace = true, features = ["derive"] }
rmp-serde = { workspace = true }
bytemuck = "1.25"
thiserror = { workspace = true }
miniz_oxide = "0.9"
crc32fast = "1.5"

[dev-dependencies]
ac2-proto = { path = ".", features = ["samples"] }
proptest = { workspace = true }
miniz_oxide = "0.9"
sha2 = { workspace = true }
