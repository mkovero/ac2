[package]
name = "ac2-plot"
description = "wgpu renderer for ac2-scene scenes: lines, fills, heatmaps, grids, text."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ac2-scene = { path = "../ac2-scene" }
bytemuck = { version = "1", features = ["derive"] }
glyphon = "0.12"
pollster = "1.0"
wgpu = "30"

[dev-dependencies]
ac2-proto = { path = "../ac2-proto" }
ac2-testkit = { path = "../ac2-testkit", features = ["image"] }
