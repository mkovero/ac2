[package]
name = "ac2-paths"
description = "Where ac2 keeps its files (platform config and data directories) and atomic file writes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The shared tracing subscriber for the daemon and the UI (stderr plus a log file).
log = ["dep:tracing-core", "dep:tracing-subscriber"]

[dependencies]
directories = "6"
tracing-core = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }

[dev-dependencies]
log = "0.4"
tempfile = "3"
tracing = "0.1"
