[package]
name = "ac2-testkit"
description = "Test support: golden vectors from tools/refgen, tolerance comparison, golden images."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# PNG I/O and per-pixel comparison for renderer golden images. Off by default so numeric
# tests do not build an image codec.
image = ["dep:png"]

[dependencies]
num-complex = { workspace = true }
png = { version = "0.18", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
realfft = { workspace = true }
